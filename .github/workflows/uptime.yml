name: Uptime Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  CURL_OPTS: --retry 3 --retry-delay 10 --retry-all-errors --max-time 30

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage
        run: curl $CURL_OPTS -fsS -o /dev/null -w "%{http_code}\n" "https://art.adamsimms.xyz/waves/"

      - name: Check station API
        run: |
          set -euo pipefail
          out="$(mktemp)"
          curl $CURL_OPTS -fsS -o "$out" "https://art.adamsimms.xyz/waves/call-api"
          python3 -c "import json,sys; data=json.load(open(sys.argv[1])); assert 'wind' in data and 'wave_period' in data, data" "$out"

      - name: Check health endpoint
        run: |
          set -euo pipefail
          out="$(mktemp)"
          curl $CURL_OPTS -sS -o "$out" "https://art.adamsimms.xyz/waves/health"
          python3 -c "import json,sys; data=json.load(open(sys.argv[1])); assert data.get('status') in ('ok', 'degraded'), data" "$out"
